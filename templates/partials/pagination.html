{% if is_paginated %}
  <div class="pagination">
    {% if page_obj.has_previous %}
      <a class="btn btn-outline btn-sm" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">&larr; Previous</a>
    {% endif %}
    <span class="muted small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn-outline btn-sm" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Next &rarr;</a>
    {% endif %}
  </div>
{% endif %}
