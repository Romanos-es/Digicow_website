{% extends "base.html" %}
{% block title %}Staff login · Digicow{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card accent auth-card">
    <h1>Staff login</h1>
    <p class="muted">For Digicow coordinators, trainers and Q&amp;A agents.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn" type="submit" style="width:100%">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
